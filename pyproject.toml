[project]
name = "fera"
version = "0.1.0"
description = "FERA — Fuel Efficiency Research & Analysis platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Avishkar Gopale" }
]
dependencies = [
    "fastapi",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "py7zr>=1.1.3",
    "pydantic-settings",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "backend.app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
